<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen"><meta name="apple-mobile-web-app-title" content="古惑仔成魔">
<meta name="theme-color" content="#000"><link rel="manifest" href="manifest.json">
<title>古惑仔成魔 · 原型</title>
<style>
html,body{margin:0;background:#000;width:100%;overflow:hidden;position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 height:100%;height:var(--app-h,100dvh);min-height:100%;min-height:var(--app-h,100dvh)}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;max-width:100%;max-height:100%;position:relative;z-index:2}
#orient-hint{display:none;position:fixed;left:0;right:0;bottom:0;z-index:3;padding:.55rem .75rem .65rem;
 background:linear-gradient(transparent,rgba(0,0,0,.82));color:#ffd400;font:600 14px/1.35 sans-serif;text-align:center;
 pointer-events:none;box-sizing:border-box}
#orient-hint.show{display:block}
#orient-hint button{font:700 15px sans-serif;margin-left:.6rem;padding:.35rem .75rem;border:2px solid #ffd400;border-radius:10px;
 background:#222;color:#fff;cursor:pointer;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#orient-hint button:active{background:#333}
</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<div id="orient-hint" aria-hidden="true"><span>横屏体验更佳，竖屏也可直接玩</span><button type="button" id="orient-hint-close">知道了</button></div>
<script>document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault())</script>
<script>
// 不依赖 ES module：画布尺寸 + 非阻塞横屏提示（main.js / audio 失败时仍可点屏开局）
(function(){
  const GW=1280,GH=720,C=document.getElementById('c'),hint=document.getElementById('orient-hint'),hintBtn=document.getElementById('orient-hint-close');
  const HINT_KEY='orient-hint-dismiss';
  function dismissHint(){
    try{sessionStorage.setItem(HINT_KEY,'1')}catch(_){}
    document.documentElement.classList.add('hint-dismissed');
    if(hint){hint.classList.remove('show');hint.setAttribute('aria-hidden','true')}
    scheduleFit();
  }
  if(sessionStorage.getItem(HINT_KEY)==='1')document.documentElement.classList.add('hint-dismissed');
  if(hintBtn&&!hintBtn.dataset.bound){
    hintBtn.dataset.bound='1';
    hintBtn.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();dismissHint()});
  }
  function viewSize(){
    const vv=window.visualViewport;
    let w=vv&&vv.width>0?vv.width:innerWidth;
    let h=vv&&vv.height>0?vv.height:innerHeight;
    if(w<50)w=innerWidth||document.documentElement.clientWidth||screen.width||GW;
    if(h<50)h=innerHeight||document.documentElement.clientHeight||screen.height||GH;
    return{w:Math.round(w)||1,h:Math.round(h)||1};
  }
  function syncHint(){
    if(!hint||document.documentElement.classList.contains('hint-dismissed')){hint?.classList.remove('show');hint?.setAttribute('aria-hidden','true');return}
    const coarse=matchMedia('(pointer:coarse)').matches||matchMedia('(hover:none)').matches||'ontouchstart'in window;
    const portrait=innerHeight>innerWidth;
    const show=coarse&&portrait;
    hint.classList.toggle('show',show);
    hint.setAttribute('aria-hidden',show?'false':'true');
  }
  function fit(){
    const{w,h}=viewSize();
    if(!C||w<1||h<1)return;
    const s=Math.min(w/GW,h/GH);
    C.style.width=(GW*s)+'px';
    C.style.height=(GH*s)+'px';
    document.documentElement.style.setProperty('--app-h',h+'px');
    syncHint();
  }
  function scheduleFit(){fit();requestAnimationFrame(fit);setTimeout(fit,80);setTimeout(fit,300);setTimeout(fit,800)}
  window.__scheduleFit=scheduleFit;
  addEventListener('resize',scheduleFit);addEventListener('orientationchange',scheduleFit);
  window.visualViewport?.addEventListener('resize',scheduleFit);
  window.visualViewport?.addEventListener('scroll',scheduleFit);
  scheduleFit();
})();
</script>
<script type="module">import('./src/main.js').catch(e=>console.error('[game] main.js 加载失败',e))</script></body></html>
